[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymirea"
version = "0.4.0"
description = "Async Python client for Мирэа LKS (schedule, grades, attendance, ACS, SSO)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "silverhans" }, { name = "atomic-pancake-49" }]
keywords = ["mirea", "lks", "university", "async", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/atomic-pancake-49/pymirea"
Issues = "https://github.com/atomic-pancake-49/pymirea/issues"
Upstream = "https://github.com/daftrent/pymirea"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.20", "mcp>=1.2"]
tls = ["curl_cffi>=0.7"]
mcp = ["mcp>=1.2"]

[project.scripts]
pymirea = "pymirea.cli:main"
pymirea-mcp = "pymirea.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["pymirea"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E722", "E741", "F841"]  # pre-existing patterns in the upstream code
